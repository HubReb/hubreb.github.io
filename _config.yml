remote_theme: daattali/beautiful-jekyll@6.0.1

title: Rebekka Hubert
subtitle: Software Engineer
author: Rebekka Hubert
description: "Software engineering, systems modernization, and AI-assisted development."

navbar-links:
  About Me: "aboutme"
  Projects: "projects"
  Blog: "/"

url: "https://hubreb.github.io"
avatar: "/assets/img/avatar.png"

social-network-links:
  github: HubReb
  email: "hubert.rebekka@mailbox.org"

share-links-active:
  twitter: true
  linkedin: true

paginate: 5
excerpt_length: 50

timezone: "Europe/Berlin"
future: false

site-css:
  - "/assets/css/custom-styles.css"

defaults:
  - scope:
      path: ""
    values:
      share-img: "/assets/img/og-image.png"
      head-extra:
        - goatcounter.html

exclude:
  - CLAUDE.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - .github

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme
